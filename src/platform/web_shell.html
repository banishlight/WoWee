<!doctype html>
<!--
  The page the browser build runs in (the link step's --shell-file); the
  generated script goes where {{{ SCRIPT }}} is. Only the canvas: as large as
  the window allows at the client's own aspect, and a line of status text shows
  while the page downloads and when something fails.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoWee</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #c8c8c8;
      font: 14px system-ui, sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #canvas {
      display: block;
      outline: none;
    }
    #status {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 24px;
      text-align: center;
      pointer-events: none;
    }
    #status:empty { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading…</div>
  <script>
    var statusLine = document.getElementById('status');
    var Module = {
      canvas: document.getElementById('canvas'),
      // Emscripten reports download progress here, then '' when it is done.
      setStatus: function (text) { statusLine.textContent = text; },
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
    };
    // The element itself is sized to the picture: SDL maps the mouse against
    // the element's box, so letterboxing inside it would shift every click.
    function fitCanvas() {
      var c = Module.canvas;
      if (!c.width || !c.height) return;
      var scale = Math.min(innerWidth / c.width, innerHeight / c.height);
      c.style.width = Math.floor(c.width * scale) + 'px';
      c.style.height = Math.floor(c.height * scale) + 'px';
    }
    addEventListener('resize', fitCanvas);
    new MutationObserver(fitCanvas).observe(Module.canvas, { attributes: true, attributeFilter: ['width', 'height'] });
    // The client's main loop runs as a promise, so a failure inside it
    // arrives here rather than at onerror - and said nothing at all, which is
    // how a Firefox-only fault took an afternoon to find.
    //
    // A pointer lock the browser declines - already held, asked too fast, or
    // wanting a fresh click - is not a failure: the client asks again on the
    // next click. Browsers word it differently (NotAllowedError,
    // InUseAttributeError, "already locked"), so match the sense, not a name.
    function benign(r) {
      if (!r) return false;
      var msg = String(r.message || r);
      return r.name === 'NotAllowedError' || r.name === 'InUseAttributeError' ||
             /pointer|already locked|user gesture|autoplay/i.test(msg);
    }
    // The first frame of ours in the stack, so a stopped client names where it
    // stopped on screen - a report can be a screenshot, without the console.
    function where(r) {
      if (!r || !r.stack) return '';
      var lines = String(r.stack).split('\n');
      for (var i = 0; i < lines.length; i++) {
        if (/wasm|wowee/i.test(lines[i])) return ' — ' + lines[i].trim().slice(0, 140);
      }
      return lines[0] ? ' — ' + lines[0].trim().slice(0, 140) : '';
    }
    var stopped = false;
    addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      if (benign(r) || stopped) return;   // the first fault is the one to show
      stopped = true;
      var text = r && r.message ? r.name + ': ' + r.message : String(r);
      console.error('Stopped: ' + text, r);
      statusLine.textContent = 'Stopped: ' + text + where(r);
    });
    window.onerror = function (message) {
      statusLine.textContent = 'Stopped: ' + message + ' (the console has the details)';
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
